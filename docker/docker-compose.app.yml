# qiuqiuwriter 应用部署
# 包含：Backend, Frontend, Admin
# 启动命令：docker compose -f docker-compose.app.yml -p qiuqiuwriter up -d

name: qiuqiuwriter-app

services:
  # ---------- 后端应用 ----------
  backend:
    image: qiuqiuwriter-backend:latest
    container_name: qiuqiuwriter-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      # 本地 infra 未启用 MongoDB 认证；生产 Compose 使用 docker/.env 中的强凭证。
      MONGODB_USERNAME: ""
      MONGODB_PASSWORD: ""
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
    working_dir: /app
    command: >
      sh -c "uvicorn memos.api.ai_api:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ai/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    # depends_on 移除，因为基础设施在另一个 compose 文件中管理
    # 也可以保留但需要保证网络连通，这里由 external network 保证
    networks:
      - qiuqiuwriter_net

  # ---------- 前端与管理后台（Nginx 托管） ----------
  frontend:
    image: nginx:alpine
    container_name: qiuqiuwriter-frontend
    restart: unless-stopped
    # nginx/frontend.conf 监听容器内 80 端口，故将宿主机 81 映射到容器 80。
    # 与 start.sh 提示的 http://localhost:81 一致。
    ports:
      - "81:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qiuqiuwriter_net

  admin:
    image: nginx:alpine
    container_name: qiuqiuwriter-admin
    restart: unless-stopped
    ports:
      - "8889:8889"
    volumes:
      - ../admin/dist:/usr/share/nginx/html:ro
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8889/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qiuqiuwriter_net

networks:
  qiuqiuwriter_net:
    external: true
    name: qiuqiuwriter_qiuqiuwriter_net
